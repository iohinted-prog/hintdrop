<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #card {
      background: #fffaf7;
      border: 1px solid #efdcd2;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(80, 50, 30, 0.16);
      overflow: hidden;
      padding: 18px;
    }
    #status { text-align: center; font-size: 13px; color: #6b6b6b; padding: 20px 0; }

    /* Shared error banner */
    #errorBanner {
      display: none;
      background: #fdeceb;
      border: 1px solid #f3c6c1;
      color: #b23a30;
      font-size: 12px;
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    /* Not-logged-in view */
    #notLoggedIn { display: none; text-align: center; }
    #notLoggedIn p { font-size: 13px; color: #4a4a4a; line-height: 1.5; margin: 0 0 14px; }
    .primaryButton {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(to bottom, #ff966f, #ff7e54);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .primaryButton:disabled { opacity: 0.6; cursor: default; }
    #showManualLogin { display: inline-block; margin-top: 10px; font-size: 11px; color: #9a9a9a; text-decoration: underline; cursor: pointer; }

    #loginForm { display: none; margin-top: 14px; border-top: 1px solid #f0e5dd; padding-top: 14px; }
    #loginForm input { width: 100%; padding: 9px 10px; margin-bottom: 8px; border: 1px solid #ead8ce; border-radius: 12px; font-size: 13px; background: #fff; }
    #loginForm button { width: 100%; padding: 10px; border: none; border-radius: 12px; background: #2f3b2d; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }

    /* Review / result view */
    #result { display: none; }
    #resultImage {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 16px;
      background: #f0e5dd;
      display: none;
      margin-bottom: 10px;
    }
    #gradientPicker { display: none; gap: 8px; margin-bottom: 10px; }
    #gradientPicker button {
      flex: 1;
      height: 54px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      background-size: cover;
      background-position: center;
    }
    #gradientPicker button.selected { border-color: #ff7e54; }
    #gradientHint { font-size: 11px; color: #9a9a9a; margin: -4px 0 10px; }

    label.fieldLabel { font-size: 11px; font-weight: 600; color: #9a9a9a; display: block; margin-bottom: 3px; }
    #titleInput, #priceInput {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid #ead8ce;
      border-radius: 12px;
      font-size: 13px;
      background: #fff;
      font-family: inherit;
    }
    #titleInput { font-weight: 600; color: #1a1a1a; }
    #priceInput { color: #df7b59; font-weight: 600; }

    #addButton { width: 100%; padding: 11px; border: none; border-radius: 14px; background: linear-gradient(to bottom, #ff966f, #ff7e54); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }

    #loggedInAs { font-size: 11px; color: #9a9a9a; border-top: 1px solid #f0e5dd; padding-top: 10px; margin-top: 14px; }
    #logoutLink { color: #9a9a9a; text-decoration: underline; cursor: pointer; }

    /* Board picker */
    #boardPicker { display: none; }
    #boardPicker p.pickerLabel { font-size: 12px; font-weight: 600; color: #6b6b6b; margin: 0 0 8px; }
    .boardRow {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid #f0dfd6;
      border-radius: 14px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      cursor: pointer;
    }
    .boardRow:hover { background: #fff5f0; border-color: #e8c9bc; }
    #newBoardRow { display: flex; gap: 6px; margin-top: 8px; }
    #newBoardInput { flex: 1; padding: 8px 10px; border: 1px solid #ead8ce; border-radius: 12px; font-size: 12px; }
    #createBoardButton { padding: 8px 12px; border: none; border-radius: 12px; background: #2f3b2d; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
    #pickerBack { font-size: 11px; color: #9a9a9a; text-decoration: underline; cursor: pointer; margin-top: 8px; display: inline-block; }

    /* Success state */
    #saveSuccess { display: none; text-align: center; padding: 10px 0; }
    #saveSuccess p { font-size: 13px; font-weight: 600; color: #2f3b2d; margin: 0 0 12px; }
    #saveSuccess .successActions { display: flex; gap: 8px; }
    #saveSuccess .successActions a, #saveSuccess .successActions button {
      flex: 1;
      padding: 9px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid #ead8ce;
      background: #fff;
      color: #1a1a1a;
    }
    #viewInHintDrop { background: #2f3b2d; color: #fff; border: none; }
  </style>
</head>
<body>
  <div id="card">
    <div id="errorBanner"></div>
    <div id="status">Loading…</div>

    <div id="notLoggedIn">
      <p>You're not logged into HintDrop in this browser yet.</p>
      <button id="openHintDropButton" class="primaryButton">Open HintDrop to log in</button>
      <div id="showManualLogin">Have an email/password account? Log in manually</div>
      <div id="loginForm">
        <input id="emailInput" type="email" placeholder="Email" autocomplete="username" />
        <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="loginButton">Log in</button>
      </div>
    </div>

    <div id="result">
      <img id="resultImage" alt="" />
      <div id="gradientPicker"></div>
      <div id="gradientHint">No photo found — pick a colour instead, or add one in HintDrop later.</div>

      <label class="fieldLabel" for="titleInput">Name</label>
      <input id="titleInput" type="text" />

      <label class="fieldLabel" for="priceInput">Price (optional)</label>
      <input id="priceInput" type="text" placeholder="e.g. £29.99" />

      <button id="addButton" class="primaryButton">+ Add to Hints</button>

      <div id="boardPicker">
        <p class="pickerLabel">Add to which list?</p>
        <div id="boardList"></div>
        <div id="newBoardRow">
          <input id="newBoardInput" type="text" placeholder="New list name" />
          <button id="createBoardButton">Create</button>
        </div>
        <div id="pickerBack">Cancel</div>
      </div>

      <div id="saveSuccess">
        <p id="saveSuccessText"></p>
        <div class="successActions">
          <a id="viewInHintDrop" href="#" target="_blank">View it</a>
          <button id="addAnotherButton">Add another</button>
        </div>
      </div>

      <div id="loggedInAs">
        Logged in as <span id="loggedInEmail"></span> · <span id="logoutLink">Log out</span>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="hints.js"></script>
  <script src="popup.js"></script>
</body>
</html>
