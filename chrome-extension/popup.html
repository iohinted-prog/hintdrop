<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 18px;
      background: #fffaf7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #status {
      text-align: center;
      font-size: 13px;
      color: #6b6b6b;
      padding: 20px 0;
    }
    #result {
      display: none;
    }
    #resultImage {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      background: #f0e5dd;
      display: none;
      margin-bottom: 10px;
    }
    #resultTitle {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    #resultPrice {
      font-size: 13px;
      color: #df7b59;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="status">Reading this page…</div>
  <div id="result">
    <img id="resultImage" alt="" />
    <div id="resultTitle"></div>
    <div id="resultPrice"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
