 <ellipse cx="730" cy="855" rx="22" ry="48" transform="rotate(-35 730 855)"/>
 <ellipse cx="770" cy="880" rx="22" ry="46" transform="rotate(45 770 880)"/>
</g>

<!-- Roses -->
<g fill="#fffaf2" stroke="#d6b27c" stroke-width="4">
 <circle cx="450" cy="820" r="27"/><circle cx="475" cy="855" r="25"/>
 <circle cx="430" cy="890" r="23"/>
 <circle cx="750" cy="820" r="27"/><circle cx="725" cy="855" r="25"/>
 <circle cx="770" cy="890" r="23"/>
</g>
<g fill="none" stroke="#d7a866" stroke-width="4">
 <path d="M437 820Q450 805 463 820Q450 835 437 820Z"/>
 <path d="M463 855Q475 840 487 855Q475 870 463 855Z"/>
 <path d="M419 890Q430 876 441 890Q430 904 419 890Z"/>
 <path d="M737 820Q750 805 763 820Q750 835 737 820Z"/>
 <path d="M713 855Q725 840 737 855Q725 870 713 855Z"/>
 <path d="M759 890Q770 876 781 890Q770 904 759 890Z"/>
</g>

<!-- Small flowers -->
<g fill="#fff" stroke="#d9b67f" stroke-width="3">
 <circle cx="420" cy="845" r="7"/><circle cx="488" cy="830" r="7"/>
 <circle cx="445" cy="910" r="7"/><circle cx="780" cy="845" r="7"/>
 <circle cx="712" cy="830" r="7"/><circle cx="755" cy="910" r="7"/>
</g>

<!-- Door handles -->
<circle cx="580" cy="960" r="14" fill="url(#gold)" stroke="#986300" stroke-width="5"/>
<circle cx="620" cy="960" r="14" fill="url(#gold)" stroke="#986300" stroke-width="5"/>

<!-- Steps -->
<path d="M355 1085H845L875 1115H325Z"
 fill="#eee7dd" stroke="#999187" stroke-width="8"/>
<path d="M325 1115H875L900 1145H300Z"
